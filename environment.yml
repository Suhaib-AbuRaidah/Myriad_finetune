name: myriad_finetune
channels:
  - conda-forge
  - nodefaults
variables:
  PYTHONNOUSERSITE: "1"
  PYTHONPATH: ""
dependencies:
  - python=3.11
  - pip
  - ffmpeg=8.0.1
  - numpy=1.26.4
  - pip:
      # CUDA 11.8 supports the RTX 2080 SUPER and the installed 535 driver.
      - --extra-index-url https://download.pytorch.org/whl/cu118
      - torch==2.7.1+cu118
      - torchvision==0.22.1+cu118
      # The fine-tuning encoder adapter expects the DINOv3 layout in 5.17.
      - transformers==5.17.0
      - einops==0.8.1
      - jaxtyping==0.3.3
      - tqdm>=4.67,<5
      - Pillow==11.3.0
      - av>=14,<16
      - webdataset>=0.2.111,<2
      - opencv-python-headless==4.11.0.86
      - omegaconf==2.3.0
      - hydra-core==1.3.2
      - billiards==0.5.0
      - click>=8.1,<9
      - wandb>=0.19,<1
      - gradio==5.49.1
      - fire>=0.7,<1
      - matplotlib>=3.9,<3.11
      - pandas>=2.2,<3
      - tabulate>=0.9,<1
      - mediapy>=1.2,<2
      # Provides the decord module with correct wheel compatibility metadata.
      - eva-decord==0.6.1
      - ffmpeg-python==0.2.0
      # Used by the benchmark dataset download script.
      - gsutil>=5.30,<6
